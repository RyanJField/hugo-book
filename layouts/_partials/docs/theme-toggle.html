{{- /* Light / dark mode toggle button, driven by assets/theme-toggle.js.
       Hidden until the script has set data-theme on <html>, so it never shows without JavaScript. */ -}}
{{- if default true .Site.Params.BookThemeToggle -}}
<button type="button" class="book-theme-toggle"
  data-label-dark="{{ partial "docs/text/i18n" "Switch to dark mode" }}"
  data-label-light="{{ partial "docs/text/i18n" "Switch to light mode" }}"
  aria-label="{{ partial "docs/text/i18n" "Switch to dark mode" }}">
  <svg class="book-theme-toggle-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
  <svg class="book-theme-toggle-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
</button>
{{- end -}}
